<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspector header regression</title>
    <style>
      body {
        margin: 0;
        font: 13px system-ui;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
      }
      iframe {
        display: block;
        width: 100%;
        height: calc(100dvh - 80px);
        border: 0;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="run">Run Inspector header checks</button>
      <button id="matrix">Run layout and theme matrix</button>
      <label
        >Preview size
        <select id="preview-size">
          <option value="1920,1080">1920 × 1080</option>
          <option value="390,720">390 × 720</option>
          <option value="320,720">320 × 720</option>
          <option value="960,360">960 × 360</option>
        </select>
      </label>
      <button id="resize">Resize preview</button>
      <button id="theme">Switch map theme</button>
      <output id="status">Waiting for local application.</output>
    </header>
    <iframe id="map" src="/" title="Local KiMap under test"></iframe>
    <pre id="results"></pre>
    <script type="module" src="./inspector-header-fixture.js"></script>
  </body>
</html>
